name: Compile C++ Raylib to Web & Deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.52

      - name: Get Raylib source
        run: |
          git clone --depth 1 --branch 5.0 https://github.com/raysan5/raylib.git raylib

      - name: Compile C++ main.cpp and Raylib directly to WebAssembly
        run: |
          mkdir -p dist
          emcc main.cpp \
            raylib/src/rcore.c \
            raylib/src/rshapes.c \
            raylib/src/rtext.c \
            raylib/src/rtextures.c \
            raylib/src/utils.c \
            -o dist/index.html \
            -O3 -Wall \
            -Iraylib/src \
            -DPLATFORM_WEB \
            -s USE_GLFW=3 \
            -s WASM=1 \
            -s ALLOW_MEMORY_GROWTH=1 \
            --shell-file raylib/src/minshell.html

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
