<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BrainRot Game</title>
  
  <!-- Подключаем Telegram Web App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    h2 {
      font-size: 24px;
      text-align: center;
    }

    /* Красивая кнопка Monobank */
    .mono-btn {
      width: 85%;
      max-width: 320px;
      padding: 18px 20px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      color: #ffffff;
      background: linear-gradient(135deg, #e52d27, #b31217);
      box-shadow: 0 4px 15px rgba(229, 45, 39, 0.4);
      transition: transform 0.1s ease;
      text-align: center;
    }

    .mono-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <h2>🧠 BrainRot Clicker</h2>

  <!-- Кнопка оплаты -->
  <button class="mono-btn" onclick="openMono()">
    💳 Задонатить / Купить кейс
  </button>

  <script>
    let tg = window.Telegram.WebApp;
    
    // Разворачиваем игру на весь экран
    tg.expand();
    tg.ready();

    function openMono() {
      // Твоя ссылка на Банку Monobank
      let monoUrl = "https://send.monobank.ua/jar/TA9hxgAzA"; 

      // Перенаправляем игрока на страницу оплаты
      tg.openLink(monoUrl);
    }
  </script>

</body>
</html>
