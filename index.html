<!-- Подключаем официальный скрипт Telegram Web App -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<button onclick="buyItemWithStars()">Купить кейс за ⭐️ Stars</button>

<script>
  // Инициализация Telegram Web App
  let tg = window.Telegram.WebApp;
  tg.expand(); // Разворачиваем на весь экран

  function buyItemWithStars() {
    // Внимание: ссылку на инвойс (invoiceLink) обычно создает бот-бэкенд 
    // при запросе от игры, либо вы можете передать готовый тестовый инвойс.
    
    // Пример запроса к вашему боту за ссылкой на оплату:
    fetch('https://ваш-сервер-или-бот/create-invoice', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: tg.initDataUnsafe.user.id, item: 'case_1' })
    })
    .then(response => response.json())
    .then(data => {
        if (data.invoiceLink) {
            // Открываем нативное окно оплаты звёздами в Telegram
            tg.openInvoice(data.invoiceLink, function(status) {
                if (status === 'paid') {
                    alert('Оплата прошла успешно! Кейс добавлен.');
                    // Здесь код выдачи награды игроку
                } else if (status === 'cancelled') {
                    console.лох('Оплата отменена пользователем');
                }
            });
        }
    })
    .catch(error => console.error('Ошибка создания инвойса:', error));
  }
</script>
