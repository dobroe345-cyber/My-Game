<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>My Game</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; outline: none; }
  #msg { position: fixed; left: 0; right: 0; top: 45%; text-align: center; color: #fff;
    font: 600 18px -apple-system, Helvetica, sans-serif; pointer-events: none; }
</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
<div id="msg">Загрузка…</div>
<script>
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  var Module = {
    canvas: document.getElementById('canvas'),
    print: function (t) { console.log(t); },
    printErr: function (t) { console.error(t); },
    setStatus: function (t) {
      var m = document.getElementById('msg');
      if (!t) { m.style.display = 'none'; } else { m.style.display = 'block'; m.textContent = 'Загрузка…'; }
    }
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
